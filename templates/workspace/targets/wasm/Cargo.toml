[package]
name = "wasm"
version = "0.1.0"
edition = "2024"
authors = ["{{authors}}"]

[lib]
crate-type = ["cdylib"]

[dependencies]
mirui = { version = "{{mirui-version}}", git = "https://github.com/W-Mai/mirui", rev = "39ed01becace7be4b533d43d2e3e5581a8448351", default-features = false, features = ["web-canvas"] }
app = { path = "../../app", features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.122"
web-sys = { version = "0.3.99", features = ["Document", "HtmlCanvasElement", "Window"] }
console_error_panic_hook = "0.1"
