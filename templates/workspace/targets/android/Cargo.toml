[package]
name = "target-android"
version = "0.1.0"
edition = "2024"
authors = ["{{authors}}"]

[lib]
crate-type = ["cdylib"]

[dependencies]
mirui = { version = "{{mirui-version}}", git = "https://github.com/W-Mai/mirui", rev = "39ed01becace7be4b533d43d2e3e5581a8448351", features = ["wgpu-android"] }
winit = { version = "0.30", features = ["android-native-activity"] }
app = { path = "../../app", features = ["std"] }

[package.metadata.android]
package = "{{android-package}}"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "{{project-name}}"
