[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
authors = ["{{authors}}"]

[lib]
name = "mirui_android"
crate-type = ["cdylib"]

[dependencies]
mirui = { version = "{{mirui-version}}", features = ["wgpu-android"] }
winit = { version = "0.30", features = ["android-native-activity"] }


[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
