[template]
cargo_generate_version = ">=0.18.0"

[placeholders.mirui-version]
type = "string"
prompt = "mirui version to depend on"
default = "0.46"
regex = "^\\d+\\.\\d+(\\.\\d+)?$"

[placeholders.backend]
type = "string"
prompt = "render backend"
choices = ["wgpu", "sw"]
default = "wgpu"

[placeholders.ios-bundle-id]
type = "string"
prompt = "iOS bundle identifier"
default = "rs.mirui.app"
regex = "^[A-Za-z][A-Za-z0-9-]*(\\.[A-Za-z][A-Za-z0-9-]*)+$"
