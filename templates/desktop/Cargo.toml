[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
authors = ["{{authors}}"]

[dependencies]
{% if backend == "sdl" %}
mirui = { version = "{{mirui-version}}", features = ["sdl"] }
sdl2 = { version = "0.37", features = ["bundled", "static-link"] }
{% else %}
mirui = { version = "{{mirui-version}}", features = ["wgpu"] }
{% endif %}

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
